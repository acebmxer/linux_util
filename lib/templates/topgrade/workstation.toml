# Topgrade — Workstation Profile
# Generated by linux_util. Edit to suit your setup.
# Full reference: https://github.com/topgrade-rs/topgrade/blob/master/config.example.toml

[misc]
# Skip the retry prompt on failure — avoids getting stuck when Ctrl+C breaks terminal input
no_retry = true

# Run `sudo -v` at the start to cache credentials and avoid mid-run password prompts
pre_sudo = true

# Steps to run — comment out anything you don't want updated
only = [
    "system",
    "flatpak",
    "snap",
    "firmware",
    "cargo",
    "pip3",
    "node",
    "brew_formula",
    "brew_cask",
    "nix",
    "home_manager",
]

[linux]
# Yay/Paru (Arch AUR helpers) — pass extra flags if desired
# yay_arguments = "--nodevel"

[firmware]
# Offer to install available firmware updates
upgrade = true

[npm]
# Use sudo if the npm global directory isn't owned by the current user
# use_sudo = true

[python]
# Uncomment to also upgrade pip-installed packages
# enable_pip_review = true
# enable_pip_review_local = true
