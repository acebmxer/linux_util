# Topgrade — Workstation Profile
# Generated by linux_util. Edit to suit your setup.
# Full reference: https://github.com/topgrade-rs/topgrade/wiki/Configuration

[misc]
# Disable the summary table (set false to always show it)
no_retry = false

# Don't automatically reboot after kernel updates — prompt instead
pre_sudo = true

# Notify on completion via desktop notification (requires notify-send)
# notify_each_step = false

# Steps to run — comment out anything you don't want updated
only = [
    "system",
    "flatpak",
    "snap",
    "firmware",
    "cargo",
    "pip3",
    "npm",
    "brew",
    "nix",
    "home_manager",
]

[linux]
# Set to true to run a full dist-upgrade (apt full-upgrade / dnf distro-sync)
# instead of a regular upgrade. Suitable for rolling/semi-rolling distros.
# use_full_upgrade = false

# Yay/Paru (Arch AUR helpers) — pass extra flags if desired
# aur_flags = "--noconfirm"

[firmware]
# Allow fwupd to install firmware updates
upgrade = true

[npm]
# Only update globally installed npm packages (not per-project node_modules)
use_sudo = false

[pip3]
# Upgrade only packages installed at the user level (pip install --user)
use_sudo = false
