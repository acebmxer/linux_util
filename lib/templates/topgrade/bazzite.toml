# Topgrade — Bazzite Profile
# Generated by linux_util. Edit to suit your setup.
# Full reference: https://github.com/topgrade-rs/topgrade/blob/master/config.example.toml
#
# Bazzite ships its own system topgrade config at:
#   /usr/share/ublue-os/topgrade.toml  (read-only system defaults)
#   /etc/ublue-os/topgrade.toml        (optional system-wide overrides)
#
# This file is placed at ~/.config/topgrade/topgrade.toml and takes precedence
# over the system defaults for your user session only.
#
# IMPORTANT: The `ujust update` command (the recommended update path on Bazzite)
# passes Bazzite's own config to topgrade — this user config is used when you
# run `topgrade` directly. Keep both in sync if you customise either.

[misc]
# Skip the retry prompt on failure — avoids getting stuck when Ctrl+C breaks terminal input
no_retry = true

# Run `sudo -v` at the start to cache credentials and avoid mid-run password prompts
pre_sudo = true

# Steps to always skip — topgrade auto-discovers everything else
# Bazzite's ujust update handles the system image (rpm-ostree); disable firmware
# flashes here so they remain deliberate
disable = [
    "firmware", # Firmware flashes should be deliberate — remove to enable
]

# Don't let pip failures abort the whole run
ignore_failures = ["pip3", "clam_av_db"]

# Clean up old temp files after each run
cleanup = true

# Send a desktop notification when the run finishes (only on failure)
notify_end = "on_failure"

[git]
# Repos to pull during updates — add your dotfiles/projects here
# repos = ["~/dotfiles", "~/src/*/"]
max_concurrency = 5
arguments = "--rebase --autostash"

[firmware]
# Set to true to actually install firmware updates (also remove firmware from disable list above)
upgrade = false

[python]
# Uncomment to also upgrade pip-installed packages
# enable_pip_review = true
# enable_pip_review_local = true

[npm]
# Use sudo if the npm global directory isn't owned by the current user
# use_sudo = true
