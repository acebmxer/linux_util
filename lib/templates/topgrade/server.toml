# Topgrade — Server Profile
# Generated by linux_util. Edit to suit your setup.
# Full reference: https://github.com/topgrade-rs/topgrade/blob/master/config.example.toml
#
# Conservative profile designed for headless servers. GUI update steps,
# gaming tooling, and automatic reboots are all disabled. Only package-manager
# and container updates are enabled so you stay in control of restarts.

[misc]
# Skip the retry prompt on failure — avoids getting stuck when Ctrl+C breaks terminal input
no_retry = true

# Run `sudo -v` at the start to cache credentials and avoid mid-run password prompts
pre_sudo = true

# Only run these steps — nothing GUI-related, no firmware flashes
only = [
    "system",
    "snap",
    "flatpak",
    "containers",
    "pip3",
]

[linux]
# Yay/Paru (Arch AUR helpers) — pass extra flags if desired
# yay_arguments = "--nodevel"

[firmware]
# Firmware updates on servers should be planned maintenance, not automatic
upgrade = false

[python]
# Uncomment to also upgrade pip-installed packages
# enable_pip_review = true
# enable_pip_review_local = true

[containers]
# Use sudo for non-rootless container installs
# use_sudo = false
