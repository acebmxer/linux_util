name: Distro EOL check

# Weekly: compare the distro-smoke matrix in ci.yml with endoflife.date and keep
# one issue open while a release needs dropping or adding.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "CI distro matrix needs updating (EOL / new releases)"
    steps:
      - uses: actions/checkout@v4

      - name: Compare matrix with endoflife.date
        run: python3 .github/scripts/check_distro_eol.py .github/workflows/ci.yml "$RUNNER_TEMP/report.md"

      - name: Open, update or close the tracking issue
        run: |
          existing=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\"))[0].number // empty")
          if [ -f "$RUNNER_TEMP/report.md" ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file "$RUNNER_TEMP/report.md"
            else
              gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/report.md"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Matrix is current again."
          fi
