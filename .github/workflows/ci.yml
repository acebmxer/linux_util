name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run test suite
        run: bash tests/test_linux_util.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on main script
        run: shellcheck -S error linux_util.sh manage_logs.sh

      - name: Run ShellCheck on lib modules
        run: shellcheck -S error lib/*.sh

      - name: Run ShellCheck on installers
        run: shellcheck -S error lib/installers/*.sh

  distro-smoke:
    name: Distro Detection (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every release still supported by its distro (https://endoflife.date),
        # so keep this list current: add a release when it ships, drop it at
        # end of life. Arch and Tumbleweed are rolling, so one image each.
        include:
          - image: debian:13
            name: Debian 13
            family: debian
            pkg_mgr: apt
          - image: debian:12
            name: Debian 12
            family: debian
            pkg_mgr: apt
          - image: ubuntu:26.10
            name: Ubuntu 26.10
            family: debian
            pkg_mgr: apt
          - image: ubuntu:26.04
            name: Ubuntu 26.04
            family: debian
            pkg_mgr: apt
          - image: ubuntu:24.04
            name: Ubuntu 24.04
            family: debian
            pkg_mgr: apt
          - image: ubuntu:22.04
            name: Ubuntu 22.04
            family: debian
            pkg_mgr: apt
          - image: fedora:45
            name: Fedora 45
            family: fedora
            pkg_mgr: dnf
          - image: fedora:44
            name: Fedora 44
            family: fedora
            pkg_mgr: dnf
          - image: fedora:43
            name: Fedora 43
            family: fedora
            pkg_mgr: dnf
          # Rocky 10 is published only under rockylinux/rockylinux, not the
          # Docker Official Images name used for Rocky 8 and 9.
          - image: rockylinux/rockylinux:10
            name: Rocky Linux 10
            family: rhel
            pkg_mgr: dnf
          - image: rockylinux:9
            name: Rocky Linux 9
            family: rhel
            pkg_mgr: dnf
          - image: rockylinux:8
            name: Rocky Linux 8
            family: rhel
            pkg_mgr: dnf
          - image: archlinux:base
            name: Arch Linux
            family: arch
            pkg_mgr: pacman
          - image: opensuse/tumbleweed
            name: openSUSE Tumbleweed
            family: suse
            pkg_mgr: zypper
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare minimal image (non-root user, missing base tools)
        run: |
          case "${{ matrix.family }}" in
            fedora)
              dnf install -y -q util-linux
              ;;
            suse)
              zypper --non-interactive install -y gawk
              ;;
          esac
          useradd -m testuser
          chown -R testuser:testuser "$GITHUB_WORKSPACE"

      - name: Run detect_distro as a non-root user
        shell: bash
        run: |
          output=$(su testuser -c "bash linux_util.sh --version" 2>&1)
          echo "$output"
          detected=$(echo "$output" | grep "^Detected:")
          [[ -n "$detected" ]] || { echo "::error::detect_distro produced no 'Detected:' line"; exit 1; }
          echo "$detected" | grep -q "family: ${{ matrix.family }}, package manager: ${{ matrix.pkg_mgr }}" || {
            echo "::error::expected family=${{ matrix.family }} pkg_mgr=${{ matrix.pkg_mgr }}, got: $detected"
            exit 1
          }
